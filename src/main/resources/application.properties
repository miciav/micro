spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${MYSQL_ADDRESS:localhost}:${MYSQL_PORT:3306}/${DB_NAME:db_micro}?sslMode=${DB_SSL_MODE:verify-full}
spring.datasource.username=${DB_USERNAME:micro}
spring.datasource.password=${DB_PASSWORD:tasd}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.show-sql=false
# Demo initialization deliberately recreates its schema at startup.
spring.jpa.hibernate.ddl-auto=create
spring.profiles.active=Demo
spring.jpa.open-in-view=false
